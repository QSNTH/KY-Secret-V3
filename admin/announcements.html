<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KY Secret V3 · 更新日志 / 公告</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f7fafc;color:#222;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.tb{background:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e2ecf5;flex-shrink:0}
.tb h1{font-size:17px;font-weight:900}.tb .nv{display:flex;gap:6px;flex-wrap:wrap}
.tb a,.tb button{border:1px solid #e2e8f0;border-radius:40px;background:#fff;color:#334155;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:550;text-decoration:none;white-space:nowrap}
.tb a:hover,.tb button:hover{background:#eef2f6}
.wrap{flex:1;display:flex;min-height:0}
.lp{width:320px;min-width:240px;border-right:1px solid #e2ecf5;background:#fff;display:flex;flex-direction:column}
.lt{padding:10px 12px;border-bottom:1px solid #eef3f0}
.lt button{width:100%;padding:8px;border:none;border-radius:8px;background:#1a7a3a;color:#fff;font-weight:600;cursor:pointer;font-size:13px}
.li{flex:1;overflow-y:auto;padding:6px}
.item{padding:10px 12px;border-radius:8px;cursor:pointer;border:2px solid transparent;margin-bottom:4px}
.item:hover{background:#f5fdf7}.item.a{border-color:#1a7a3a;background:#edf7f0}
.item .ttl{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mt{font-size:10px;color:#aaa;display:flex;justify-content:space-between;margin-top:2px}
.dp{flex:1;overflow-y:auto;padding:20px 24px;background:#f8fbf9}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.04);max-width:760px}
label{display:block;font-size:12px;color:#64748b;font-weight:600;margin:12px 0 5px}
input,textarea,select{font-family:inherit;width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;outline:0}
textarea{resize:vertical;min-height:80px;line-height:1.6}
.ev{display:flex;gap:6px;margin-bottom:6px}
.ev input.t{flex:0 0 150px}.ev input.x{flex:1}
.ev button{border:none;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:0 12px;cursor:pointer;font-size:14px}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{padding:10px 22px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:13px}
.save{background:#1a7a3a;color:#fff}.del{background:#e74c3c;color:#fff}.ghost{background:#e2e8f0;color:#475569}
.ph{color:#aaa;text-align:center;padding:80px 20px;font-size:14px}
.toast{position:fixed;bottom:20px;right:20px;background:#222;color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;z-index:999;opacity:0;transition:.3s;pointer-events:none}.toast.s{opacity:1}
</style>
</head>
<body>
<div class="tb"><h1>📋 更新日志 / 公告</h1><div class="nv"><a href="dashborad.html">← 面板</a><a href="../status/history.html" target="_blank">公开页</a><a href="complaints.html">投诉</a><button onclick="logout()">退出登录</button></div></div>
<div class="wrap">
  <div class="lp">
    <div class="lt"><button onclick="newItem()">+ 新建一条</button></div>
    <div class="li" id="li"><div style="text-align:center;color:#aaa;padding:20px">加载中...</div></div>
  </div>
  <div class="dp" id="dp"><div class="ph">从左侧选择一条，或点「新建一条」</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
var T=localStorage.getItem('ky_token')||'';function hd(){return{'Authorization':'Bearer '+T};}
var B='',ALL=[],CUR=null;
(function init(){if(!T){location.href='index.html';return;}
  var urls=['https://ky-secret-v3.pages.dev/config.json','https://raw.githubusercontent.com/QSNTH/KY-Secret-V3/refs/heads/main/config.json','/config.json'];
  function tryAt(i){if(i>=urls.length){toast('配置加载失败');return;}
    var u=urls[i];u+=(u.indexOf('?')>=0?'&':'?')+'t='+Date.now();
    fetch(u).then(function(r){return r.json()}).then(function(c){B=((c.backend||'').trim())+c.api;load();}).catch(function(){tryAt(i+1);});}
  tryAt(0);
})();
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('s');setTimeout(function(){e.classList.remove('s');},2000);}
function logout(){fetch(B+'/admin/logout',{method:'POST',headers:hd()}).catch(function(){});localStorage.removeItem('ky_token');location.href='index.html';}
function j(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||('错误 '+r.status));return d;});}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function parseEvents(x){try{if(Array.isArray(x))return x;if(!x)return [];var a=JSON.parse(x);return Array.isArray(a)?a:[];}catch(e){return [];}}
function load(){
  fetch(B+'/admin/status-history',{headers:hd()}).then(j).then(function(d){
    ALL=(d||[]);var el=document.getElementById('li');
    if(!ALL.length){el.innerHTML='<div style="text-align:center;color:#aaa;padding:20px">暂无记录</div>';return;}
    el.innerHTML=ALL.map(function(it,i){
      return '<div class="item'+(CUR&&CUR.id===it.id?' a':'')+'" onclick="edit('+i+')"><div class="ttl">'+esc(it.title||'(无标题)')+'</div>'
        +'<div class="mt"><span>'+esc(it.status||'')+'</span><span>'+esc((it.updated_at||it.created_at||'').substring(5,16))+'</span></div></div>';
    }).join('');
  }).catch(function(e){document.getElementById('li').innerHTML='<div style="color:#e74c3c;padding:16px">加载失败: '+esc(e.message)+'</div>';});
}
function renderForm(it){
  CUR=it||{};
  var events=parseEvents(CUR.events_json);
  var dp=document.getElementById('dp');
  dp.innerHTML='<div class="card">'
    +'<label>标题</label><input id="f_title" value="'+esc(CUR.title||'')+'" placeholder="例如：2026-09-22 发帖队列异常">'
    +'<label>状态</label><select id="f_status">'
      +['investigating','ongoing','resolved','scheduled'].map(function(s){return '<option value="'+s+'"'+((CUR.status||'resolved')===s?' selected':'')+'>'+s+'</option>';}).join('')
    +'</select>'
    +'<label>正文 / 说明</label><textarea id="f_body" placeholder="整体说明（可空）">'+esc(CUR.body||'')+'</textarea>'
    +'<label>时间线事件（可增减）</label><div id="evBox"></div>'
    +'<button class="ghost" style="margin-top:8px;padding:6px 14px;border-radius:8px;border:none;cursor:pointer" onclick="addEvent()">+ 添加一行</button>'
    +'<div class="acts"><button class="save" onclick="saveItem()">保存</button>'
    +(CUR.id?'<button class="ghost" onclick="newItem()">清空/新建</button>':'')
    +'</div></div>';
  var box=document.getElementById('evBox');box.innerHTML='';
  if(!events.length){events=[{time:'',text:''}];}
  events.forEach(function(ev){addEvent(ev.time||ev.t||'', ev.text||ev.d||'');});
  document.body.classList.add('detail');
}
function addEvent(time,text){
  var box=document.getElementById('evBox');
  var div=document.createElement('div');div.className='ev';
  div.innerHTML='<input class="t" placeholder="时间/标签" value="'+esc(time||'')+'">'
    +'<input class="x" placeholder="事件描述" value="'+esc(text||'')+'">'
    +'<button onclick="this.parentNode.remove()">×</button>';
  box.appendChild(div);
}
function edit(i){renderForm(ALL[i]);load();}
function newItem(){renderForm(null);document.getElementById('li').querySelectorAll('.item').forEach(function(x){x.classList.remove('a');});}
function saveItem(){
  var title=document.getElementById('f_title').value.trim();
  if(!title){toast('请填写标题');return;}
  var body=document.getElementById('f_body').value;
  var status=document.getElementById('f_status').value;
  var events=[];
  document.querySelectorAll('#evBox .ev').forEach(function(row){
    var t=row.querySelector('.t').value.trim();
    var x=row.querySelector('.x').value.trim();
    if(t||x)events.push({time:t,text:x});
  });
  var payload={title:title,status:status,body:body,events:events};
  if(CUR&&CUR.id)payload.id=CUR.id;
  fetch(B+'/admin/status-history',{method:'POST',headers:Object.assign({},hd(),{'Content-Type':'application/json'}),body:JSON.stringify(payload)})
  .then(j).then(function(){toast('已保存');CUR=null;load();document.getElementById('dp').innerHTML='<div class="ph">已保存，从左侧继续编辑</div>';})
  .catch(function(e){toast('保存失败: '+e.message);});
}
</script>
</body>
</html>
