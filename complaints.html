<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=2.0">
<title>KY Secret · 投诉</title>
<style>
/* ===== KY Secret 全站视觉系统 V3 — 投诉页 ===== */
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{background:#f7fafc;color:#0f2a40;padding:2rem 1rem;display:flex;justify-content:center;min-height:100vh}
.ky-container{max-width:780px;width:100%;margin:0 auto}
.nav-header{text-align:center;margin-bottom:2.5rem}
.logo{font-size:5rem;font-weight:900;color:#000;letter-spacing:-0.02em;margin-bottom:0.5rem;line-height:1}
.nav-buttons{display:flex;gap:0.75rem;justify-content:center;margin-bottom:1.2rem;flex-wrap:wrap}
.nav-btn{padding:0.5rem 1.4rem;border:1px solid #e2e8f0;border-radius:40px;background:#fff;color:#334155;text-decoration:none;font-size:0.9rem;font-weight:550;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.nav-btn:hover{background:#eef2f6;border-color:#cbd5e1}
.nav-btn.active{background:#0f172a;color:#fff;border-color:#0f172a}
.card{background:#fff;border-radius:28px;border:1px solid #ecf1f7;box-shadow:0 4px 14px rgba(0,20,40,.02);padding:2rem 2rem 2.2rem;margin-bottom:1.5rem}
.card-header{margin-bottom:.4rem;display:flex;align-items:center;gap:.6rem}
.card-header h1{font-size:1.65rem;font-weight:700;color:#0f2a40;letter-spacing:-.3px;display:flex;align-items:center;gap:.6rem}
.subtitle{font-size:.85rem;color:#7996ae;line-height:1.6;margin-bottom:1.6rem}
.tabs{display:flex;gap:.75rem;margin-bottom:1.6rem;flex-wrap:wrap}
.tab{padding:.5rem 1.4rem;border:1px solid #e2e8f0;border-radius:40px;background:#fff;color:#334155;font-size:.9rem;font-weight:550;cursor:pointer;transition:.15s;font-family:inherit}
.tab:hover{background:#eef2f6;border-color:#cbd5e1}
.tab.on{background:#0f172a;color:#fff;border-color:#0f172a}
.form-item{margin-bottom:1.4rem}
.form-item label{display:block;font-size:.92rem;font-weight:600;color:#1e3f5c;margin-bottom:.55rem}
input,textarea{width:100%;padding:.9rem 1.2rem;border:1.5px solid #e2ecf5;border-radius:20px;font-size:.95rem;background:#fff;transition:.15s;color:#1f3a57;outline:0;font-family:inherit}
input:focus,textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.08)}
input::placeholder,textarea::placeholder{color:#9bb1c4}
textarea{min-height:160px;resize:vertical;line-height:1.6}
.btn-primary{width:100%;padding:1rem 1.5rem;background:#0f172a;color:#fff;border:1px solid #1e2a44;border-radius:40px;font-size:1.05rem;font-weight:650;letter-spacing:.3px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:.6rem;font-family:inherit}
.btn-primary:hover{background:#1e2f45;transform:scale(1.01);box-shadow:0 8px 18px rgba(15,35,60,.12)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.res{display:none;margin-top:1.2rem;padding:1rem 1.2rem;border-radius:18px;font-size:.88rem;line-height:1.65}
.res.ok{display:block;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.res.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
.token{font-family:SFMono-Regular,Consolas,monospace;font-size:.76rem;word-break:break-all;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:.65rem .8rem;margin-top:.55rem;color:#0f2a40}
.tip{font-size:.78rem;color:#6f8faa;background:#f4faff;border-radius:14px;padding:.7rem 1rem;margin-top:.9rem;display:flex;align-items:flex-start;gap:.4rem}
.st{display:inline-block;padding:2px 12px;border-radius:20px;font-size:.72rem;font-weight:700}
.st.open{background:#fef3c7;color:#92400e}.st.reviewing{background:#dbeafe;color:#1e40af}
.st.resolved{background:#dcfce7;color:#166534}.st.rejected{background:#fee2e2;color:#991b1b}
.muted{color:#7996ae;font-size:.75rem;text-align:center;margin-top:1.2rem}
.footer-note{text-align:center;margin-top:1.8rem;font-size:.75rem;color:#7996ae;border-top:1px solid #e2ecf5;padding-top:1.8rem}
.footer-note a{color:#2c5282;text-decoration:none;font-weight:500;margin:0 .4rem}
.footer-note a:hover{text-decoration:underline}
@media(max-width:550px){.logo{font-size:4rem}.card{padding:1.5rem}.card-header h1{font-size:1.35rem}}
</style>
</head>
<body>
<div class="ky-container">
  <div class="nav-header">
    <div class="logo">KYSECRET</div>
    <div class="nav-buttons">
      <a href="./status/index.html" class="nav-btn">📊 状态</a>
      <a href="./status/history.html" class="nav-btn">📋 历史</a>
      <a href="./index.html" class="nav-btn">✉️ 投稿</a>
      <a href="./result.html" class="nav-btn">🔍 查询</a>
      <a href="./complaints.html" class="nav-btn active">📣 投诉</a>
      <a href="./issues.html" class="nav-btn">💡 建议</a>
      <a href="./admin/index.html" class="nav-btn">⚙️ 管理</a>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button id="tabSubmit" class="tab on" onclick="tab('submit')">📣 提交投诉</button>
      <button id="tabLookup" class="tab" onclick="tab('lookup')">🔍 查询进度</button>
    </div>

    <div id="paneSubmit">
      <div class="card-header"><h1>📣 投诉帖子</h1></div>
      <div class="subtitle">填写帖子编号（格式 KYSV3-XXXXXXXX）与投诉原因，提交后会生成查询凭证。</div>
      <div class="form-item">
        <label>帖子编号</label>
        <input id="hid" placeholder="KYSV3-XXXXXXXX" autocomplete="off">
      </div>
      <div class="form-item">
        <label>投诉原因</label>
        <textarea id="reason" placeholder="请说明投诉原因，例如侵犯隐私、抄袭、不实信息…"></textarea>
      </div>
      <button id="btnSubmit" class="btn-primary" onclick="submitComplaint()"><span>📨</span> 提交投诉</button>
      <div class="res" id="resSubmit"></div>
    </div>

    <div id="paneLookup" style="display:none">
      <div class="card-header"><h1>🔍 查询投诉进度</h1></div>
      <div class="subtitle">粘贴提交时得到的凭证或链接。</div>
      <div class="form-item">
        <label>查询凭证</label>
        <input id="token" placeholder="粘贴凭证 / 链接" autocomplete="off">
      </div>
      <button class="btn-primary" onclick="lookup()"><span>🔎</span> 查询</button>
      <div class="res" id="resLookup"></div>
      <div class="tip"><span>🔒</span><span>凭证是查询与接收回复的唯一依据，请自行保存；遗失后无法找回。</span></div>
    </div>

    <div class="muted">投诉渠道开关由管理员控制；关闭时提交会失败。</div>
  </div>

  <div class="footer-note">
    <a href="./status/index.html">📊 实时状态</a> ·
    <a href="./status/history.html">📋 历史事件</a> ·
    <a href="./index.html">✉️ 匿名投稿</a>
    <br><span style="font-size:.7rem;color:#94a3b8">RV_1.21_Stable</span>
  </div>
</div>

<script>
var B='';
(function init(){
  var urls=['https://ky-secret-v3.pages.dev/config.json','https://raw.githubusercontent.com/QSNTH/KY-Secret-V3/refs/heads/main/config.json','/config.json'];
  function tryAt(i){if(i>=urls.length){setRes('resSubmit','err','配置加载失败，请刷新重试');return;}
    var u=urls[i];u+=(u.indexOf('?')>=0?'&':'?')+'t='+Date.now();
    fetch(u).then(function(r){return r.json()}).then(function(c){B=(c.backend||'').trim();}).catch(function(){tryAt(i+1);});}
  tryAt(0);
  var m=location.search.match(/[?&]token=([^&]+)/);
  if(m){document.getElementById('token').value=decodeURIComponent(m[1]);tab('lookup');}
})();
function tab(t){
  var s=t==='submit';
  document.getElementById('tabSubmit').classList.toggle('on',s);
  document.getElementById('tabLookup').classList.toggle('on',!s);
  document.getElementById('paneSubmit').style.display=s?'block':'none';
  document.getElementById('paneLookup').style.display=s?'none':'block';
}
function setRes(id,cls,html){var e=document.getElementById(id);e.className='res '+cls;e.innerHTML=html;}
function api(p){return B+'/api'+p;}
function submitComplaint(){
  var hid=document.getElementById('hid').value.trim().toUpperCase();
  var reason=document.getElementById('reason').value.trim();
  if(!hid||!reason){setRes('resSubmit','err','请填写帖子编号和投诉原因');return;}
  if(!B){setRes('resSubmit','err','配置加载中，请稍候再试');return;}
  var btn=document.getElementById('btnSubmit');btn.disabled=true;
  fetch(api('/complaints'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hid:hid,reason:reason})})
  .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||('错误 '+r.status));return d;});})
  .then(function(d){
    var link='complaints.html?token='+encodeURIComponent(d.token);
    try{localStorage.setItem('ky_complaint_'+d.token,link);}catch(e){}
    setRes('resSubmit','ok','✅ 投诉已提交，请保存下面的查询链接或凭证：<div class="token">'+link+'</div><div class="token">'+d.token+'</div>');
  })
  .catch(function(e){setRes('resSubmit','err','提交失败：'+e.message);})
  .finally(function(){btn.disabled=false;});
}
function lookup(){
  var raw=document.getElementById('token').value.trim();
  if(!raw){setRes('resLookup','err','请输入凭证');return;}
  if(!B){setRes('resLookup','err','配置加载中，请稍候再试');return;}
  var m=raw.match(/[?&]token=([^&\s]+)/);var token=m?decodeURIComponent(m[1]):raw;
  fetch(api('/complaints/'+encodeURIComponent(token)))
  .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||('错误 '+r.status));return d;});})
  .then(function(d){
    var lm={open:'待处理',reviewing:'处理中',resolved:'已解决',rejected:'已驳回'};
    setRes('resLookup','ok','<b>帖子编号：</b>'+esc(d.hid)+'<br><b>状态：</b><span class="st '+esc(d.status)+'">'+(lm[d.status]||esc(d.status))+'</span>'
      +'<br><b>投诉原因：</b>'+esc(d.reason||'')
      +'<br><b>管理员回复：</b>'+(d.reply?esc(d.reply):'<span style="color:#94a3b8">暂无回复</span>')
      +'<br><span style="color:#94a3b8;font-size:.75rem">提交时间：'+esc(d.created_at||'')+'</span>');
  })
  .catch(function(e){setRes('resLookup','err','查询失败：'+e.message);});
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
</body>
</html>
