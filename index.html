    <script>
    // ========= KY Secret V3 动态配置加载 =========
    window.KY_CONFIG = {
        backendUrl: '',
        apiPrefix: '/api',
        endpoints: {}
    };

    // 使用立即执行函数，保证配置在DOM加载前启动
    // 主源：pages.dev 部署站的 config.json（Pages 构建最快，避免 raw CDN 延迟）
    // 兜底：GitHub raw（由后端 Tunnel 自动推送当前 URL）
    // 断网/超时时只重试，不做任何本地或硬编码兜底
    (async function initConfig() {
        const CONFIG_URLS = [
            'https://ky-secret-v3.pages.dev/config.json',
            'https://raw.githubusercontent.com/QSNTH/KY-Secret-V3/refs/heads/main/config.json'
        ];
        const FETCH_TIMEOUT_MS = 8000;  // 单次请求超时
        const MAX_TIMEOUTS = 5;         // 连续超时 5 次 → 重新获取 URL
        const RETRY_DELAY_MS = 1500;    // 每次重试间隔
        const ROUND_DELAY_MS = 3000;    // 一轮失败后、开始新一轮前的间隔

        // 先挂载 getUrl 工具函数（后面所有路径都会用到）
        window.KY_CONFIG.getUrl = function(endpoint, params = {}) {
            let path = window.KY_CONFIG.endpoints[endpoint];
            if (!path) path = endpoint.startsWith('/') ? endpoint : `/${endpoint}`;
            Object.keys(params).forEach(key => { path = path.replace(`{${key}}`, params[key]); });
            return `${window.KY_CONFIG.backendUrl}${window.KY_CONFIG.apiPrefix}${path}`;
        };

        // 带超时的 fetch（防止断网时请求无限挂起）
        function fetchWithTimeout(url, ms) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms);
            return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
        }

        // 校验 backend URL：拦截 "https://.trycloudflare.com" 这类前缀丢失的坏 URL
        function isValidBackendUrl(url) {
            if (!url) return false;
            url = String(url).trim();
            if (!/^https?:\/\//i.test(url)) return false;
            if (/^https?:\/\/\./i.test(url)) return false;
            if (/\.trycloudflare\.com/i.test(url)) {
                return /^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/i.test(url);
            }
            return /^https?:\/\/[^\s\/]+(\/.*)?$/i.test(url);
        }

        // 依次尝试多个源，全部失败才抛错
        async function fetchConfigFrom() {
            let lastErr = null;
            for (const url of CONFIG_URLS) {
                try {
                    const resp = await fetchWithTimeout(url + '?t=' + Date.now(), FETCH_TIMEOUT_MS);
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const cfg = await resp.json();
                    const backend = String(cfg.backend || cfg.backendBaseUrl || '').trim();
                    if (!isValidBackendUrl(backend)) throw new Error('无效 backend URL: ' + backend);
                    return cfg;
                } catch (e) { lastErr = e; }
            }
            throw lastErr || new Error('config fetch failed');
        }

        function applyConfig(cfg) {
            window.KY_CONFIG.backendUrl = (cfg.backend || cfg.backendBaseUrl || '').trim();
            window.KY_CONFIG.apiPrefix = cfg.api || '/api';
            window.KY_CONFIG.endpoints = cfg;
            const offline = document.getElementById('kyOfflineNotice');
            if (offline) offline.remove();
        }

        function showOfflineNotice() {
            if (document.getElementById('kyOfflineNotice')) return;
            const el = document.createElement('div');
            el.id = 'kyOfflineNotice';
            el.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:12000;max-width:calc(100vw - 28px);padding:10px 14px;border:1px solid #f3c46b;border-radius:10px;background:#fff8e7;color:#7a4b00;box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:13px;text-align:center';
            el.innerHTML = '后端暂时不可用，投稿功能会在连接恢复后自动启用。 <button type="button" style="margin-left:8px;border:0;border-radius:6px;padding:4px 8px;background:#7a4b00;color:#fff;cursor:pointer">立即重试</button>';
            el.querySelector('button').onclick = function(){ el.remove(); round = 0; };
            document.body.appendChild(el);
        }

        // 每轮最多 MAX_TIMEOUTS 次超时重试；一轮失败 → 重新获取 URL（新的一轮），直到成功
        let round = 0;
        while (!window.KY_CONFIG.backendUrl) {
            round++;
            let loaded = false;
            for (let attempt = 1; attempt <= MAX_TIMEOUTS; attempt++) {
                try {
                    const cfg = await fetchConfigFrom();
                    applyConfig(cfg);
                    loaded = true;
                    console.log(`✅ 配置加载成功 (第${round}轮/第${attempt}次):`, window.KY_CONFIG.backendUrl);
                    break;
                } catch (e) {
                    console.warn(`⚠️ 配置获取失败 (第${round}轮 ${attempt}/${MAX_TIMEOUTS}):`, e.message);
                    await new Promise(r => setTimeout(r, RETRY_DELAY_MS));
                }
            }
            if (!loaded) {
                console.warn(`⛔ 连续 ${MAX_TIMEOUTS} 次超时 → 重新获取 URL（第 ${round + 1} 轮）...`);
                if (round >= 2) showOfflineNotice();
                await new Promise(r => setTimeout(r, ROUND_DELAY_MS));
            }
        }

        // 配置加载完成后触发表单可以提交
        window.dispatchEvent(new CustomEvent('configLoaded', { detail: window.KY_CONFIG }));

        // Tunnel 每天会换新 URL：页面打开期间每 60s 后台刷新一次，变了就热更新
        setInterval(async function() {
            try {
                const fresh = await fetchConfigFrom();
                const newUrl = String(fresh.backend || '').trim();
                if (newUrl !== window.KY_CONFIG.backendUrl) {
                    applyConfig(fresh);
                    console.log('🔄 后台刷新 Tunnel URL 成功:', newUrl);
                }
            } catch (e) { /* 暂时失败，下个周期再试 */ }
        }, 60000);
    })();
    </script>

    <!-- ✦ 开屏广告 ✦ -->

 <script>
        (function() {
            "use strict";

            // DOM 元素
            const titleInput = document.getElementById('title');
            const contentInput = document.getElementById('content');
            const titleCounter = document.getElementById('titleCounter');
            const contentCounter = document.getElementById('contentCounter');
            const fileInput = document.getElementById('imageFiles');
            const fileHint = document.getElementById('fileCountHint');
            const previewContainer = document.getElementById('imagePreviewContainer');
            const form = document.getElementById('kySubmitForm');
            const contentRequired = document.getElementById('contentRequired');
            
            let isSubmitting = false;
            let currentPreviewFile = null;

            // 字数统计
            function updateTitleCounter() {
                titleCounter.innerText = `${titleInput.value.length}/80`;
            }
            
            function updateContentCounter() {
                contentCounter.innerText = `${contentInput.value.length}/200`;
                updateRequiredFields();
            }

            // 更新提示：标题必填，内容/图片选填
            function updateRequiredFields() {
                const hasTitle = titleInput.value.trim().length > 0;
                const hasContent = contentInput.value.trim().length > 0;
                document.getElementById('contentHint').textContent = hasTitle
                    ? (hasContent ? '✅ 标题 + 内容' : '✅ 标题已填，可选填内容')
                    : '✍️ 标题必填 · 内容选填';
            }

            titleInput.addEventListener('input', updateTitleCounter);
            contentInput.addEventListener('input', updateContentCounter);
            
            // 初始化
            updateTitleCounter();
            updateContentCounter();
            updateRequiredFields();

            // 渲染预览缩略图（带删除按钮）
            function renderPreview(url) {
                previewContainer.innerHTML = '';
                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';
                const img = document.createElement('img');
                img.src = url;
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.innerHTML = '×';
                removeBtn.onclick = function() {
                    fileInput.value = '';
                    previewContainer.innerHTML = '';
                    fileHint.innerText = '未选择任何文件';
                    currentPreviewFile = null;
                    window._kyImageFile = null;
                    window._kyFaceBlur = true;
                    updateRequiredFields();
                };
                previewItem.appendChild(img);
                previewItem.appendChild(removeBtn);
                previewContainer.appendChild(previewItem);
            }

            function resetImageUI() {
                fileHint.innerText = '未选择任何文件';
                previewContainer.innerHTML = '';
                currentPreviewFile = null;
                window._kyImageFile = null;
                window._kyOriginalFile = null;
                window._kyFaceBlur = true;
                updateRequiredFields();
            }

            // 图片选择（只允许1张）→ 进入隐私编辑器
            fileInput.addEventListener('change', function(e) {
                const files = Array.from(fileInput.files);

                if (files.length === 0) { resetImageUI(); return; }

                // 只取第一张
                const file = files[0];

                // 如果选了多张，提示并只保留第一张
                if (files.length > 1) {
                    showToast('只支持上传1张图片，已自动选择第一张');
                    const dt = new DataTransfer();
                    dt.items.add(file);
                    fileInput.files = dt.files;
                }

                if (!file.type.startsWith('image/')) {
                    showToast('请选择图片文件');
                    resetImageUI();
                    return;
                }

                if (window.openImageEditor) {
                    window.openImageEditor(file, function(processed, faceBlur) {
                        currentPreviewFile = processed;
                        window._kyImageFile = processed;
                        window._kyFaceBlur = faceBlur !== false;
                        try {
                            const dt = new DataTransfer();
                            dt.items.add(processed);
                            fileInput.files = dt.files;
                        } catch (err) { /* 部分旧浏览器不支持 DataTransfer，忽略 */ }
                        fileHint.innerText = '已处理 1 张图片（已隐私打码）';
                        renderPreview(URL.createObjectURL(processed));
                        updateRequiredFields();
                    }, function() {
                        if (!currentPreviewFile) resetImageUI();
                    });
                } else {
                    currentPreviewFile = file;
                    window._kyImageFile = file;
                    fileHint.innerText = `已选择 1 个文件: ${file.name}`;
                    renderPreview(URL.createObjectURL(file));
                    updateRequiredFields();
                }
            });

    // ========== 🥷 开发者模式 ==========
    // F12 → Console → 输入 enableDevMode() 开启
    // 所有 fetch 请求及响应会在控制台输出
    window.enableDevMode = function() {
      localStorage.setItem('ky_dev_mode', 'true');
      const b = document.getElementById('devBadge');
      if (b) b.style.display = 'block';
      console.log('%c🥷 开发者模式已开启 · 所有 fetch 请求将被记录', 'background:#000;color:#0f0;padding:4px 8px;border-radius:4px');
    };
    window.disableDevMode = function() {
      localStorage.setItem('ky_dev_mode', 'false');
      const b = document.getElementById('devBadge');
      if (b) b.style.display = 'none';
      console.log('%c🥷 开发者模式已关闭', 'background:#000;color:#f00;padding:4px 8px;border-radius:4px');
    };
    window.toggleDevMode = function() {
      if (localStorage.getItem('ky_dev_mode') === 'true') window.disableDevMode();
      else window.enableDevMode();
    };

    // 初始化
    if (localStorage.getItem('ky_dev_mode') === 'true') {
      setTimeout(function() { window.enableDevMode(); }, 100);
    }

    // 拦截 fetch 记录日志
    const _origFetch = window.fetch;
    window.fetch = function() {
      if (localStorage.getItem('ky_dev_mode') === 'true') {
        const url = arguments[0], opts = arguments[1] || {};
        console.log(`[DEV] ➡ ${opts.method || 'GET'} ${url}`, opts.body instanceof FormData ? [...opts.body.entries()] : opts.body || '');
      }
      return _origFetch.apply(this, arguments).then(function(r) {
        if (localStorage.getItem('ky_dev_mode') === 'true') {
          const clone = r.clone();
          clone.text().then(function(t) { console.log(`[DEV] ⬅ ${r.status} ${r.url}`, t.substring(0, 300)); });
        }
        return r;
      });
    };

    // 浮动指示器
    const _devBadge = document.createElement('div');
    _devBadge.id = 'devBadge';
    _devBadge.style.cssText = 'display:none;position:fixed;bottom:8px;left:8px;background:#000;color:#0f0;font:11px monospace;padding:2px 6px;border-radius:4px;z-index:9999;pointer-events:none;opacity:.7';
    _devBadge.textContent = '🥷 DEV';
    document.body.appendChild(_devBadge);
    if (localStorage.getItem('ky_dev_mode') === 'true') _devBadge.style.display = 'block';

    // 开屏广告：从后端 /api/ad 拉取配置（后端管理面板可改，无需重新部署前端）
    // 测试/强制显示：在网址后加 ?ad=1
    var _adForce = /[?&]ad=1(&|$)/.test(location.search) || location.hash === '#ad';
    window.closeSplash = function(remember) {
      var el = document.getElementById('splashOverlay');
      if (el) el.classList.add('hidden');
      if (remember === false) return;   // 图片加载失败时不清除显示周期
      try {
        localStorage.setItem('ky_splash_closed', Date.now().toString());
        var im = document.getElementById('splashImg');
        var key = im && im.getAttribute('data-ad-key');
        if (key) localStorage.setItem('ky_splash_closed_key', key);
      } catch (e) {}
    };
    (function(){
      var a=document.getElementById('splashLink');
      var img=document.getElementById('splashImg');
      var overlay=document.getElementById('splashOverlay');
      var loadEl=document.getElementById('splashLoading');
      if(!a||!img||!overlay)return;

      function hideAd(){ overlay.classList.add('hidden'); }

      function applyAd(c){
        if(!c||!c.enabled){ hideAd(); return; }
        // 无广告图片则不出弹窗
        var base=(window.KY_CONFIG&&window.KY_CONFIG.backendUrl)?window.KY_CONFIG.backendUrl:'';
        if(!c.image_url||!base){ hideAd(); return; }
        // 广告链接
        if(c.link&&c.link.trim()){ a.href=c.link.trim(); }
        else { a.href='#'; }
        // 显示周期：换图或改间隔后应重新显示，所以把图/间隔一起记为 key
        var delay=(parseInt(c.interval_seconds,10)||86400)*1000;
        var adKey=String(c.image_url)+'|'+delay;
        img.setAttribute('data-ad-key', adKey);
        if(!_adForce){
          try{
            var last=parseInt(localStorage.getItem('ky_splash_closed'),10);
            var lastKey=localStorage.getItem('ky_splash_closed_key')||'';
            if(last && lastKey===adKey && (Date.now()-last)<delay) return;
          }catch(e){}
        }
        // 立即显示弹窗（带加载指示），图片就绪后替换；失败只隐藏，不写时间戳
        img.onload=function(){ img.style.display='block'; if(loadEl)loadEl.style.display='none'; };
        img.onerror=function(){ img.style.display='none'; hideAd(); };
        img.style.display='none';
        if(loadEl)loadEl.style.display='flex';
        img.src=base+c.image_url;   // image_url 已带版本号，可长缓存
        overlay.classList.remove('hidden');
      }

      function loadAd(tries){
        var base=(window.KY_CONFIG&&window.KY_CONFIG.backendUrl)?window.KY_CONFIG.backendUrl:'';
        if(!base)return;
        fetch(base+'/api/ad').then(function(r){return r.json()}).then(applyAd)
        .catch(function(){
          // 后端刚启动时可能失败，最多重试 3 次
          if((tries||0)<3) setTimeout(function(){ loadAd((tries||0)+1); }, 1200);
        });
      }

      a.onclick=function(e){
        if(a.getAttribute('href')==='#'||!a.getAttribute('href')){
          e.preventDefault(); e.stopPropagation(); closeSplash();
        } else {
          e.stopPropagation();   // 真实链接：不触发遮罩关闭，正常跳转
        }
      };

      // 配置就绪即拉广告；若 configLoaded 事件已错过，用轮询兜底
      var _adStarted=false;
      function startAd(){ if(_adStarted)return; _adStarted=true; loadAd(0); }
      if(window.KY_CONFIG&&window.KY_CONFIG.backendUrl){ startAd(); }
      else{
        window.addEventListener('configLoaded', startAd, {once:true});
        var _tries=0;
        var _poll=setInterval(function(){
          _tries++;
          if(window.KY_CONFIG&&window.KY_CONFIG.backendUrl){ clearInterval(_poll); startAd(); }
          else if(_tries>=30){ clearInterval(_poll); }
        },200);
      }
    })();

    // 等待配置加载完成再允许提交
            async function waitForConfig() {
                if (window.KY_CONFIG && window.KY_CONFIG.backendUrl) {
                    return true;
                }
                // 最多等待3秒
                for (let i = 0; i < 30; i++) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    if (window.KY_CONFIG && window.KY_CONFIG.backendUrl) {
                        return true;
                    }
                }
                return false;
            }

            async function loadSiteInfo() {
                try {
                    const base = (window.KY_CONFIG && window.KY_CONFIG.backendUrl) || '';
                    if (!base) return;
                    const prefix = (window.KY_CONFIG && window.KY_CONFIG.apiPrefix) || '/api';
                    const res = await fetch(base.replace(/\/$/, '') + prefix + '/policies', {cache: 'no-store'});
                    if (!res.ok) return;
                    const data = await res.json();
                    const site = data.site || {};
                    if (site.version) { const v = document.getElementById('kyVersion'); if (v) v.textContent = site.version; }
                    if (site.notice_enabled && site.notice) {
                        const n = document.getElementById('siteNotice');
                        if (n) { n.textContent = site.notice; n.style.display = 'block'; }
                    }
                } catch (e) {}
            }
            waitForConfig().then(function (ok) { if (ok) loadSiteInfo(); });

            async function solveAltcha() {
                if (!window.crypto || !crypto.subtle) throw new Error('当前浏览器环境不支持 WebCrypto，请使用 HTTPS 打开页面');
                const base = (window.KY_CONFIG && window.KY_CONFIG.backendUrl) || '';
                if (!base) return '';
                const prefix = (window.KY_CONFIG && window.KY_CONFIG.apiPrefix) || '/api';
                const cr = await fetch(base.replace(/\/$/, '') + prefix + '/captcha/challenge', {cache: 'no-store'});
                if (!cr.ok) throw new Error('验证码服务不可用');
                const c = await cr.json();
                if (!c.enabled) return '';
                if ((c.algorithm || '').toUpperCase() !== 'SHA-256') throw new Error('验证码算法不受支持');
                const zeros = '0'.repeat(Number(c.difficulty || 3));
                for (let answer = 0; answer < 5000000; answer++) {
                    const bytes = new TextEncoder().encode(String(c.challenge) + String(answer));
                    const digest = await crypto.subtle.digest('SHA-256', bytes);
                    const hex = Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, '0')).join('');
                    if (hex.startsWith(zeros)) return [c.challenge, c.expires, c.difficulty, c.signature, answer].join(':');
                    if (answer % 2000 === 0) await new Promise(r => setTimeout(r, 0));
                }
                throw new Error('验证码计算超时');
            }

            function showToast(message, timeout) {
                let el = document.getElementById('kyPageToast');
                if (!el) {
                    el = document.createElement('div'); el.id = 'kyPageToast';
                    el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:13000;max-width:calc(100vw - 28px);padding:10px 14px;border-radius:9px;background:#182b3b;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.2);font-size:13px;text-align:center';
                    document.body.appendChild(el);
                }
                el.textContent = message; el.style.display = 'block';
                clearTimeout(el._timer); el._timer = setTimeout(() => { el.style.display = 'none'; }, timeout || 3200);
            }

            // 表单提交（全局函数供 onclick 和 addEventListener 共用）
            window.handleSubmit = async function(e) {
                if (e) e.preventDefault();

                if (isSubmitting) return;
                
                const hasTitle = titleInput.value.trim().length > 0;
                const hasContent = contentInput.value.trim().length > 0;
                const hasImage = !!currentPreviewFile;

                if (!hasTitle) {
                    showToast('请填写标题（标题将生成在图片上）');
                    titleInput.focus();
                    return;
                }

                // 等待配置加载
                const configReady = await waitForConfig();
                if (!configReady) {
                    showToast('配置加载失败，请稍后重试');
                    return;
                }

                // 构建 FormData
                const formData = new FormData();

                // 动态检查单：未全部确认 → 弹出浮窗；浮窗确认后才真正提交
                const cl = window._kyChecklist;
                if (cl && !cl.loaded) {
                    showToast('投稿检查单加载中，请稍候再试');
                    return;
                }
                if (cl && cl.enabled && cl.items.length) {
                    if (!cl.confirmed) {
                        window.kyOpenChecklist();
                        return;
                    }
                    if (cl.ack.length !== cl.items.length) {
                        cl.confirmed = false;
                        window.kyOpenChecklist();
                        return;
                    }
                    formData.append('checklist_version', cl.version || 1);
                    formData.append('checklist_ack', JSON.stringify(cl.ack.slice().sort(function(a, b) { return a - b; })));
                }
                
                // 标题（选填）
                if (titleInput.value.trim()) {
                    formData.append('title', titleInput.value.trim());
                }
                
                // 内容（选填，不填则后端用标题生图）
                if (hasContent) {
                    formData.append('content', contentInput.value.trim());
                }

                // 标签（选填）
                const tagVal = document.getElementById('tag').value.trim();
                if (tagVal) formData.append('tag', tagVal);

                // 图片（最多1张，已在编辑器内打码）
                if (hasImage) {
                    formData.append('user_image', currentPreviewFile);
                    if (window._kyOriginalFile) formData.append('user_image_original', window._kyOriginalFile);
                    formData.append('face_blur', window._kyFaceBlur === false ? 'false' : 'true');
                    formData.append('manual_masks', '[]');
                }

                try {
                    const captchaPayload = await solveAltcha();
                    if (captchaPayload) formData.append('captcha_payload', captchaPayload);
                } catch (captchaError) {
                    showToast('人机验证失败：' + (captchaError.message || captchaError));
                    return;
                }

                // 使用动态配置构建URL
                const SUBMIT_ENDPOINT = window.KY_CONFIG.getUrl('submit');
                console.log('📤 提交到:', SUBMIT_ENDPOINT, 'FormData keys:', [...formData.keys()]);

                const submitBtn = document.querySelector('.submit-btn');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<span>⏳</span> 提交中...';
                submitBtn.disabled = true;
                isSubmitting = true;

                try {
                    const response = await fetch(SUBMIT_ENDPOINT, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('后端返回错误:', response.status, errorText);
                        showToast('提交失败 (HTTP ' + response.status + ')：' + errorText.slice(0, 180));
                        return;
                    }

                    const data = await response.json();
                    const uuid = data.uuid || '';
                    const hid = data.hid || '';
                    // 跳转到结果页，带上 uuid 和 hid
                    window.location.href = 'result.html?uuid=' + encodeURIComponent(uuid) + '&hid=' + encodeURIComponent(hid);
                    
                } catch (error) {
                    console.error('提交失败:', error);
                    showToast('投稿提交失败：' + (error.message || error));
                } finally {
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    isSubmitting = false;
                }
            };
            form.addEventListener('submit', window.handleSubmit);

        })();
    </script>
<script>
/* 投稿检查单：点「匿名提交」弹出浮窗；全部确认后浮窗内按钮才可点，确认后真正提交 */
(function(){
  var st={enabled:false,version:1,items:[],ack:[],confirmed:false,loaded:false};
  window._kyChecklist=st;

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function syncButtons(){
    var ok=st.items.length>0&&st.ack.length===st.items.length;
    var b=document.getElementById('kyChecklistOk');if(b)b.disabled=!ok;
    var h=document.getElementById('kyChecklistHint');if(h)h.textContent=ok?'✅ 已全部确认，可以提交':('还需确认 '+(st.items.length-st.ack.length)+' 项');
  }

  window.kyOpenChecklist=function(){
    if(!st.enabled||!st.items.length)return;
    var m=document.getElementById('kyChecklistModal');if(!m)return;

<script>

(function(){

    var b = (window.KY_CONFIG && window.KY_CONFIG.backendUrl) || '';

  function api(path){ return backendBase() + (path.charAt(0)==='/'?path:'/'+path); }

  function rotSize(){
    var w = st.img.width, h = st.img.height;

  }
  function fwd(x, y){
    var W = st.img.width, H = st.img.height, r = st.rot;
    if (r === 90)  return { x: H - y, y: x };
    if (r === 180) return { x: W - x, y: H - y };
    if (r === 270) return { x: y, y: W - x };
    return { x: x, y: y };
  }
  function inv(x, y){
    var W = st.img.width, H = st.img.height, r = st.rot;

    if (r === 270) return { x: W - y, y: x };

  }
  function boxFwd(b){
    var a = fwd(b[0], b[1]), c = fwd(b[2], b[3]);

  }

  // 把原图旋转并缩放到 (cw,ch) 的目标画布

      c.translate(0, ch); c.rotate(3*Math.PI/2); c.scale(s2, s2);

      +     '<button data-a="clear" class="kyEdBtn">清除涂抹</button>'

      +   '</div>'
      +   '<button id="kyEdOk" style="width:100%;margin-top:12px;padding:11px;border:none;border-radius:10px;background:#0f172a;color:#fff;font-weight:600;cursor:pointer">完成并使用此图片</button>'
      +   '<div style="font-size:11px;color:#94a3b8;margin-top:8px">红框=二维码（强制打码）· 橙框=人脸 · 画笔涂抹即时显示马赛克 · 关闭画笔后单击红/橙框可删除人脸框</div>'
      + '</div>';
    document.body.appendChild(overlay);

    cv = overlay.querySelector('#kyEdCanvas');
    ctx = cv.getContext('2d');
    busyEl = overlay.querySelector('#kyEdBusy');
    faceChk = overlay.querySelector('#kyEdFace');
    drawChk = overlay.querySelector('#kyEdDraw');
    countEl = overlay.querySelector('#kyEdCount');
    warnEl = overlay.querySelector('#kyEdWarn');

    brushDot = overlay.querySelector('#kyEdBrushDot');
    stageEl = overlay.querySelector('#kyEdStage');

    overlay.querySelector('#kyEdClose').onclick = cancel;
    overlay.querySelector('#kyEdOk').onclick = confirmOk;
    faceChk.onchange = function(){ if(st){ st.faceOn = faceChk.checked; redraw(); } };
    drawChk.onchange = function(){ if(st){ st.brushOn = drawChk.checked; showBrushDot(); } };
    sizeRange.oninput = function(){ if(st){ st.brushW = parseInt(sizeRange.value,10)||32; showBrushDot(); } };
    sizeRange.onchange = function(){ setTimeout(function(){ if(brushDot) brushDot.style.display='none'; }, 900); };
    overlay.querySelector('[data-a=rotL]').onclick = function(){ if(st){ st.rot = (st.rot + 270) % 360; drawToCanvas(); } };
    overlay.querySelector('[data-a=rotR]').onclick = function(){ if(st){ st.rot = (st.rot + 90) % 360; drawToCanvas(); } };

  function openImageEditor(file, onDone, onCancel){
    ensureUI();

    window._kyOriginalFile = file;

  function iou(a, b){
    var x1=Math.max(a[0],b[0]), y1=Math.max(a[1],b[1]), x2=Math.min(a[2],b[2]), y2=Math.min(a[3],b[3]);
    var inter=Math.max(0,x2-x1)*Math.max(0,y2-y1);
    var ua=Math.max(1,(a[2]-a[0])*(a[3]-a[1])), ub=Math.max(1,(b[2]-b[0])*(b[3]-b[1]));
    return inter/(ua+ub-inter);
  }

  function addQrBox(box){
    box = clampBox(box);
    if (box[2]-box[0] < 12 && box[3]-box[1] < 12) return;
    for (var i=0;i<st.qr.length;i++){ if (iou(st.qr[i], box) > 0.35) return; }
    st.qr.push(box);
  }

  function findQrPatterns(c){
    var w=c.width, h=c.height, data;
    try { data = c.getContext('2d').getImageData(0,0,w,h).data; } catch(e){ return []; }
    var gray = new Float32Array(w*h), sum = 0, i, p;
    for (i=0,p=0;i<data.length;i+=4,p++){ var g=data[i]*0.299+data[i+1]*0.587+data[i+2]*0.114; gray[p]=g; sum+=g; }
    var th = sum/(w*h), cands=[];
    for (var y=0;y<h;y++){
      var x=0;
      while (x<w){
        while (x<w && gray[y*w+x]>=th) x++;
        var s1=x; while (x<w && gray[y*w+x]<th) x++; var b1=x-s1;
        var s2=x; while (x<w && gray[y*w+x]>=th) x++; var w1=x-s2;
        var s3=x; while (x<w && gray[y*w+x]<th) x++; var b2=x-s3;
        var s4=x; while (x<w && gray[y*w+x]>=th) x++; var w2=x-s4;
        var s5=x; while (x<w && gray[y*w+x]<th) x++; var b3=x-s5;
        if (b1<2||w1<2||b2<3||w2<2||b3<2) continue;
        var u=(b1+w1+b2+w2+b3)/7;
        if (Math.abs(b1-u)>u*0.7||Math.abs(w1-u)>u*0.7||Math.abs(b2-3*u)>3*u*0.75||Math.abs(w2-u)>u*0.7||Math.abs(b3-u)>u*0.7) continue;
        if ((b1+w1+b2+w2+b3) < w*0.03) continue;
        cands.push([s1+b1+w1+b2/2, y, u]);
      }
    }
    var clusters=[];
    cands.forEach(function(cd){
      for (var j=0;j<clusters.length;j++){
        var cl=clusters[j];
        if (Math.abs(cl[0]-cd[0])<cd[2]*7 && Math.abs(cl[1]-cd[1])<cd[2]*7){
          cl[0]=(cl[0]*cl[3]+cd[0])/(cl[3]+1); cl[1]=(cl[1]*cl[3]+cd[1])/(cl[3]+1);
          cl[2]=Math.max(cl[2],cd[2]); cl[3]++; return;
        }
      }
      clusters.push([cd[0],cd[1],cd[2],1]);
    });
    var good = clusters.filter(function(c){ return c[3]>=3; });
    if (good.length < 3) return [];
    var xs=good.map(function(c){return c[0];}), ys=good.map(function(c){return c[1];});
    var m=good.reduce(function(a,c){return a+c[2];},0)/good.length;
    var pad=m*4.5;
    return [[Math.min.apply(null,xs)-pad, Math.min.apply(null,ys)-pad, Math.max.apply(null,xs)+pad, Math.max.apply(null,ys)+pad]];
  }

  function detectQrFrontend(){
    if (!st || !st.img) return;
    var w=st.img.width, h=st.img.height, sc=Math.min(1, 720/Math.max(w,h));
    var c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*sc)); c.height=Math.max(1,Math.round(h*sc));
    c.getContext('2d').drawImage(st.img,0,0,c.width,c.height);
    function apply(boxes){
      boxes.forEach(function(b){ addQrBox([b[0]/sc, b[1]/sc, b[2]/sc, b[3]/sc]); });
      redraw();
    }
    try {
      if (window.BarcodeDetector){
        new BarcodeDetector({formats:['qr_code']}).detect(c).then(function(codes){
          var boxes=[];
          (codes||[]).forEach(function(code){ var r=code.boundingBox; if(r) boxes.push([r.x,r.y,r.x+r.width,r.y+r.height]); });
          if (boxes.length) apply(boxes); else redraw();
        }).catch(function(){ redraw(); });
      } else {
        apply(findQrPatterns(c));
      }
    } catch(e){ apply(findQrPatterns(c)); }
  }

  function scan(){
    detectQrFrontend();
    var base = backendBase();
    if (!base) { busyEl.style.display='none'; showWarn('离线：未连接后端，仅本地识别与手动打码'); redraw(); return; }
    var fd = new FormData();
    fd.append('user_image', st.file);
    fetch(api('/api/privacy/scan'), { method:'POST', body: fd })
      .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(t); }); return r.json(); })
      .then(function(d){
        st.faces = (d.faces || []).map(clampBox);
        (d.qr || []).forEach(function(b){ addQrBox(b); });
        busyEl.style.display = 'none';
        var n = st.qr.length + st.faces.length;
        showWarn(n ? ('已识别：二维码 ' + st.qr.length + ' 个，人脸 ' + st.faces.length + ' 个。二维码强制打码，人脸可取消。') : '未识别到二维码或人脸，可用马赛克画笔涂抹要遮挡的位置。');
        redraw();
      })
      .catch(function(e){
        busyEl.style.display='none';
        showWarn('后端自动识别失败（' + (e.message||e) + '），已用本地识别，可再用画笔涂抹');
        redraw();
      });
  }

  function showWarn(msg){
    warnEl.textContent = msg;
    warnEl.style.background='#fffbeb'; warnEl.style.borderColor='#fde68a'; warnEl.style.color='#b45309';
  }

  function clampBox(b){
    var x1=Math.max(0,Math.min(st.img.width, b[0])), y1=Math.max(0,Math.min(st.img.height, b[1]));
    var x2=Math.max(0,Math.min(st.img.width, b[2])), y2=Math.max(0,Math.min(st.img.height, b[3]));
    return [Math.min(x1,x2), Math.min(y1,y2), Math.max(x1,x2), Math.max(y1,y2)];
  }

  function fitCanvas(rotW, rotH){
    var maxW = Math.min(window.innerWidth - 80, 700);
    var maxH = Math.min(window.innerHeight * 0.5, 460);
    var scale = Math.min(maxW / rotW, maxH / rotH, 1);
    cv.width = Math.max(1, Math.round(rotW * scale));
    cv.height = Math.max(1, Math.round(rotH * scale));
    disp.scale = scale; disp.rotW = rotW; disp.rotH = rotH;
    disp.base = null; disp.mosaic = null;
  }

  function drawToCanvas(){
    if (!st || !st.img) return;
    var rs = rotSize();
    fitCanvas(rs.w, rs.h);
    redraw();
  }

  function boxesForDraw(){
    var list = [];
    st.qr.forEach(function(b){ list.push({b:boxFwd(b), color:'rgba(220,38,38,.9)'}); });
    if (st.faceOn) st.faces.forEach(function(b){ list.push({b:boxFwd(b), color:'rgba(234,88,12,.95)'}); });
    return list;
  }

  function makeMosaic(srcCanvas, cell){
    cell = Math.max(6, cell|0);
    var t=document.createElement('canvas');
    t.width=Math.max(1,Math.round(srcCanvas.width/cell));
    t.height=Math.max(1,Math.round(srcCanvas.height/cell));
    t.getContext('2d').drawImage(srcCanvas,0,0,t.width,t.height);
    var u=document.createElement('canvas');
    u.width=srcCanvas.width; u.height=srcCanvas.height;
    var uc=u.getContext('2d'); uc.imageSmoothingEnabled=false;
    uc.drawImage(t,0,0,t.width,t.height,0,0,u.width,u.height);
    return u;
  }

  function ensureDisplayBase(){
    if (!disp.base || disp.base.width!==cv.width || disp.base.height!==cv.height){
      disp.base=document.createElement('canvas');
      disp.base.width=cv.width; disp.base.height=cv.height;
      var bc=disp.base.getContext('2d');
      bc.fillStyle='#111'; bc.fillRect(0,0,cv.width,cv.height);
      paintRotated(bc, cv.width, cv.height);
      disp.mosaic=makeMosaic(disp.base, Math.max(8, Math.round(cv.width/60)));
    }
  }

  function paintBlocks(c, mosaic, pts, block){
    if (!pts || !pts.length || !mosaic) return;
    block=Math.max(4, block);
    var step=Math.max(2, block/2), snap=4;
    for (var i=1;i<pts.length;i++){
      var ax=pts[i-1][0], ay=pts[i-1][1], bx=pts[i][0], by=pts[i][1];
      var dist=Math.sqrt((bx-ax)*(bx-ax)+(by-ay)*(by-ay));
      var n=Math.max(1, Math.ceil(dist/step));
      for (var k=0;k<=n;k++){
        var x=ax+(bx-ax)*k/n, y=ay+(by-ay)*k/n;
        var sx=Math.floor((x-block/2)/snap)*snap, sy=Math.floor((y-block/2)/snap)*snap;
        c.imageSmoothingEnabled=false;
        c.drawImage(mosaic, sx, sy, block, block, sx, sy, block, block);
        c.imageSmoothingEnabled=true;
      }
    }
  }

  function strokePointsDisplay(sk){
    return sk.points.map(function(p){ var q=fwd(p[0],p[1]); return [q.x*disp.scale, q.y*disp.scale]; });
  }

  function showBrushDot(p){
    if (!brushDot || !st || !drawChk.checked){ if (brushDot) brushDot.style.display='none'; return; }
    var w=Math.max(6, st.brushW*2*disp.scale);
    brushDot.style.display='block';
    brushDot.style.width=w+'px'; brushDot.style.height=w+'px';
    var cx=(p&&typeof p.x==='number')?p.x:cv.width/2;
    var cy=(p&&typeof p.y==='number')?p.y:cv.height/2;
    brushDot.style.left=(cv.offsetLeft+cx-w/2)+'px';
    brushDot.style.top=(cv.offsetTop+cy-w/2)+'px';
  }

  function redraw(){
    if (!st || !st.img) return;
    var s = disp.scale;
    ensureDisplayBase();
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(disp.base, 0, 0);
    boxesForDraw().forEach(function(o){
      var x=Math.max(0,o.b[0]*s), y=Math.max(0,o.b[1]*s);
      var w=Math.min(cv.width,o.b[2]*s)-x, h=Math.min(cv.height,o.b[3]*s)-y;
      if (w<=0||h<=0) return;
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(disp.mosaic, x, y, w, h, x, y, w, h);
      ctx.imageSmoothingEnabled=true;
      ctx.strokeStyle=o.color; ctx.lineWidth=2; ctx.strokeRect(x,y,w,h);
    });
    st.strokes.forEach(function(sk){
      paintBlocks(ctx, disp.mosaic, strokePointsDisplay(sk), Math.max(4, sk.width*s));
    });
    countEl.textContent = '二维码 ' + st.qr.length + ' · 人脸 ' + (st.faceOn?st.faces.length:0) + ' · 涂抹 ' + st.strokes.length;
    if (st.drawing) paintBlocks(ctx, disp.mosaic, st.drawing, Math.max(4, st.brushW*s));
  }

  function pt(e){
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) };
  }

  function onDown(e){
    if (!st || !st.img) return;
    var p = pt(e);
    if (drawChk.checked) {
      try { cv.setPointerCapture(e.pointerId); } catch(err){}
      st.drawing = [[p.x, p.y]];
      paintBlocks(ctx, disp.mosaic, st.drawing, Math.max(4, st.brushW*disp.scale));
      showBrushDot(p);
      return;
    }
    var s = disp.scale, all = [];
    st.qr.forEach(function(b,i){ all.push({list:'qr', i:i, b:boxFwd(b)}); });
    if (st.faceOn) st.faces.forEach(function(b,i){ all.push({list:'faces', i:i, b:boxFwd(b)}); });
    for (var i=all.length-1;i>=0;i--){
      var b=all[i].b;
      if (p.x>=b[0]*s && p.x<=b[2]*s && p.y>=b[1]*s && p.y<=b[3]*s){
        if (all[i].list==='qr'){ warnEl.textContent='二维码为强制打码，不能删除'; return; }
        st.faces.splice(all[i].i,1); redraw(); return;
      }
    }
  }

  function onMove(e){
    var p = pt(e);
    if (st && st.drawing && drawChk.checked){
      var last = st.drawing[st.drawing.length-1];
      if (Math.abs(p.x-last[0])+Math.abs(p.y-last[1]) > 2){
        st.drawing.push([p.x,p.y]);
        paintBlocks(ctx, disp.mosaic, [last, [p.x,p.y]], Math.max(4, st.brushW*disp.scale));
      }
    }
    showBrushDot(p);
  }

  function onUp(){
    if (!st) return;
    if (st.drawing){
      var s = disp.scale;
      if (st.drawing.length > 1){
        st.strokes.push({ points: st.drawing.map(function(p){ var q=inv(p[0]/s, p[1]/s); return [q.x,q.y]; }), width: st.brushW });
      }
      st.drawing = null;
      redraw();
    }
  }

  function renderFinal(){
    var rs = rotSize();
    var base = document.createElement('canvas');
    base.width = rs.w; base.height = rs.h;
    var bctx = base.getContext('2d');
    bctx.fillStyle='#000'; bctx.fillRect(0,0,rs.w,rs.h);
    paintRotated(bctx, rs.w, rs.h);

    var mosaic = makeMosaic(base, Math.max(6, Math.round(Math.min(rs.w, rs.h)/120)));

    var out = document.createElement('canvas');
    out.width = rs.w; out.height = rs.h;
    var octx = out.getContext('2d');
    octx.drawImage(base, 0, 0);
    var boxes = st.qr.slice();
    if (st.faceOn) boxes = boxes.concat(st.faces);
    boxes.forEach(function(b){
      var fb = boxFwd(b), x=Math.max(0,Math.floor(fb[0])), y=Math.max(0,Math.floor(fb[1]));
      var w=Math.min(rs.w,Math.ceil(fb[2]))-x, h=Math.min(rs.h,Math.ceil(fb[3]))-y;
      if (w<=0||h<=0) return;
      octx.imageSmoothingEnabled=false;
      octx.drawImage(mosaic, x, y, w, h, x, y, w, h);
      octx.imageSmoothingEnabled=true;
    });
    st.strokes.forEach(function(sk){
      var pts = sk.points.map(function(p){ var q=fwd(p[0],p[1]); return [q.x, q.y]; });
      paintBlocks(octx, mosaic, pts, Math.max(4, sk.width));
    });

    var size = Math.max(rs.w, rs.h);
    var sq = document.createElement('canvas');
    sq.width = size; sq.height = size;
    var sctx = sq.getContext('2d');
    sctx.fillStyle = '#000'; sctx.fillRect(0,0,size,size);
    sctx.drawImage(out, Math.round((size-rs.w)/2), Math.round((size-rs.h)/2));
    return sq;
  }

  function confirmOk(){
    if (!st || !st.img) { cancel(); return; }
    document.getElementById('kyEdOk').disabled = true;
    try {
      var sq = renderFinal();
      sq.toBlob(function(blob){
        if (!blob) { showToast('图片导出失败'); document.getElementById('kyEdOk').disabled = false; return; }
        var name = (st.file.name || 'image').replace(/\.[^.]+$/, '') + '_privacy.jpg';
        var f = new File([blob], name, { type: 'image/jpeg' });
        var cb = overlay._onDone, faceOn = st.faceOn;
        close();
        if (cb) cb(f, faceOn);
      }, 'image/jpeg', 0.92);
    } catch(e) {
      showToast('处理失败: ' + (e.message||e));
      document.getElementById('kyEdOk').disabled = false;
    }
  }

  function cancel(){
    var cb = overlay && overlay._onCancel;
    close();
    if (cb) cb();
  }

  function close(){
    if (overlay) overlay.style.display = 'none';
    var ok = document.getElementById('kyEdOk'); if (ok) ok.disabled = false;
    st = null;
  }

  window.openImageEditor = openImageEditor;
})();
</script>

</body>
</html>
