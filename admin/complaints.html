<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KY Secret V3 · 投诉处理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f7fafc;color:#222;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.tb{background:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e2ecf5;flex-shrink:0}
.tb h1{font-size:17px;font-weight:900}.tb .nv{display:flex;gap:6px;flex-wrap:wrap}
.tb a,.tb button{border:1px solid #e2e8f0;border-radius:40px;background:#fff;color:#334155;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:550;text-decoration:none;white-space:nowrap}
.tb a:hover,.tb button:hover{background:#eef2f6}
.wrap{flex:1;display:flex;min-height:0}
.lp{width:400px;min-width:300px;border-right:1px solid #e2ecf5;display:flex;flex-direction:column;background:#fff}
.lt{padding:10px 12px;border-bottom:1px solid #eef3f0;display:flex;gap:6px}
.lt select{padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:12px;flex:1;outline:0}
.li{flex:1;overflow-y:auto;padding:6px}
.item{padding:10px 12px;border-radius:8px;cursor:pointer;border:2px solid transparent;margin-bottom:4px}
.item:hover{background:#f5fdf7}.item.a{border-color:#1a7a3a;background:#edf7f0}
.item .hid{font-family:monospace;font-size:11px;color:#888}
.item .rs{font-size:13px;font-weight:600;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mt{font-size:10px;color:#aaa;display:flex;justify-content:space-between}
.dp{flex:1;min-width:0;overflow-y:auto;padding:20px 24px;background:#f8fbf9}
.ph{color:#aaa;text-align:center;padding:80px 20px;font-size:14px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.04);margin-bottom:12px;max-width:720px}
.card .lb{font-size:10px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.card .vl{font-size:13px;color:#333;line-height:1.6;white-space:pre-wrap}
.postbox{background:#f8fbf9;border:1px solid #e2ecf5;border-radius:10px;padding:12px;margin-top:8px;font-size:13px}
select,input,textarea{font-family:inherit}
textarea{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;outline:0;resize:vertical;min-height:80px}
select.status{padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;outline:0}
button.save{padding:9px 20px;border:none;border-radius:10px;background:#1a7a3a;color:#fff;font-weight:600;cursor:pointer;font-size:13px}
.toast{position:fixed;bottom:20px;right:20px;background:#222;color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;z-index:999;opacity:0;transition:.3s;pointer-events:none}.toast.s{opacity:1}
.st{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10px;font-weight:700}
.st.open{background:#fef3c7;color:#92400e}.st.reviewing{background:#dbeafe;color:#1e40af}.st.resolved{background:#dcfce7;color:#166534}.st.rejected{background:#fee2e2;color:#991b1b}
@media(max-width:760px){.lp{width:100%;min-width:0}.dp{display:none}body.detail .lp{display:none}body.detail .dp{display:block}}
</style>
</head>
<body>
<div class="tb"><h1>📣 投诉处理</h1><div class="nv"><a href="dashborad.html">← 面板</a><a href="issues.html">意见</a><a href="devices.html">设备</a><a href="announcements.html">公告</a><button onclick="logout()">退出登录</button></div></div>
<div class="wrap">
  <div class="lp">
    <div class="lt"><select id="fs" onchange="load()"><option value="">全部状态</option><option value="open">待处理</option><option value="reviewing">处理中</option><option value="resolved">已解决</option><option value="rejected">已驳回</option></select><button onclick="load()" style="border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;padding:0 12px">刷新</button></div>
    <div class="li" id="li"><div style="text-align:center;color:#aaa;padding:20px">加载中...</div></div>
  </div>
  <div class="dp" id="dp"><div class="ph">从左侧选择一条投诉</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
var T=localStorage.getItem('ky_token')||'';function hd(){return{'Authorization':'Bearer '+T};}
var B='',ALL=[],CUR=null;
(function init(){if(!T){location.href='index.html';return;}
  var urls=['https://ky-secret-v3.pages.dev/config.json','https://raw.githubusercontent.com/QSNTH/KY-Secret-V3/refs/heads/main/config.json','/config.json'];
  function tryAt(i){if(i>=urls.length){toast('配置加载失败');return;}
    var u=urls[i];u+=(u.indexOf('?')>=0?'&':'?')+'t='+Date.now();
    fetch(u).then(function(r){return r.json()}).then(function(c){B=((c.backend||'').trim())+c.api;load();}).catch(function(){tryAt(i+1);});}
  tryAt(0);
})();
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('s');setTimeout(function(){e.classList.remove('s');},2000);}
function logout(){fetch(B+'/admin/logout',{method:'POST',headers:hd()}).catch(function(){});localStorage.removeItem('ky_token');location.href='index.html';}
function j(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||('错误 '+r.status));return d;});}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function lm(s){return {open:'待处理',reviewing:'处理中',resolved:'已解决',rejected:'已驳回'}[s]||s;}
function load(){
  var st=document.getElementById('fs').value;
  fetch(B+'/admin/complaints'+(st?('?status='+encodeURIComponent(st)):''),{headers:hd()}).then(j).then(function(d){
    ALL=d||[];var el=document.getElementById('li');
    if(!ALL.length){el.innerHTML='<div style="text-align:center;color:#aaa;padding:20px">暂无投诉</div>';return;}
    el.innerHTML=ALL.map(function(c,i){
      return '<div class="item'+(CUR&&CUR.id===c.id?' a':'')+'" onclick="open('+i+')">'
        +'<div class="hid">'+esc(c.hid)+'</div>'
        +'<div class="rs">'+esc(c.reason||'')+'</div>'
        +'<div class="mt"><span>'+esc((c.created_at||'').substring(5,16))+'</span><span class="st '+esc(c.status)+'">'+lm(c.status)+'</span></div>'
        +'</div>';
    }).join('');
  }).catch(function(e){document.getElementById('li').innerHTML='<div style="color:#e74c3c;padding:16px">加载失败: '+esc(e.message)+'</div>';});
}
function open(i){
  CUR=ALL[i];if(!CUR)return;
  load();
  var dp=document.getElementById('dp');
  document.body.classList.add('detail');
  dp.innerHTML='<div class="card"><div class="lb">帖子编号</div><div class="vl" style="font-family:monospace">'+esc(CUR.hid)+'</div></div>'
    +'<div class="card"><div class="lb">投诉原因</div><div class="vl">'+esc(CUR.reason||'')+'</div>'
    +'<div style="margin-top:12px"><button class="save" style="background:#2980b9" onclick="viewPost(\''+esc(CUR.hid)+'\')">查看帖子内容</button></div>'
    +'<div id="postbox"></div></div>'
    +'<div class="card"><div class="lb">处理</div>'
    +'<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><select class="status" id="cstatus">'
    +['open','reviewing','resolved','rejected'].map(function(s){return '<option value="'+s+'"'+(CUR.status===s?' selected':'')+'>'+lm(s)+'</option>';}).join('')
    +'</select></div>'
    +'<textarea id="creply" placeholder="给投诉人的回复（会显示在查询页）">'+esc(CUR.reply||'')+'</textarea>'
    +'<div style="margin-top:10px"><button class="save" onclick="save()">保存处理结果</button></div></div>';
}
function viewPost(hid){
  var box=document.getElementById('postbox');
  box.innerHTML='<div class="postbox">加载中...</div>';
  fetch(B+'/admin/find?hid='+encodeURIComponent(hid),{headers:hd()}).then(j).then(function(d){
    box.innerHTML='<div class="postbox"><div style="font-weight:600;margin-bottom:6px">'+esc(d.title||'无标题')+'</div>'
      +'<div style="color:#475569;white-space:pre-wrap">'+esc(d.content||'(空)')+'</div>'
      +'<div style="margin-top:8px;font-size:11px;color:#94a3b8">状态: '+esc(d.status||'')+' · '+esc(d.submit_time||'')+'</div></div>';
  }).catch(function(e){box.innerHTML='<div class="postbox" style="color:#e74c3c">未找到或已删除 ('+esc(e.message)+')</div>';});
}
function save(){
  if(!CUR)return;
  var status=document.getElementById('cstatus').value;
  var reply=document.getElementById('creply').value;
  fetch(B+'/admin/complaints/'+CUR.id,{method:'POST',headers:Object.assign({},hd(),{'Content-Type':'application/json'}),body:JSON.stringify({status:status,reply:reply})})
  .then(j).then(function(){toast('已保存');CUR=null;load();document.getElementById('dp').innerHTML='<div class="ph">已保存，从左侧继续处理</div>';document.body.classList.remove('detail');})
  .catch(function(e){toast('保存失败: '+e.message);});
}
</script>
</body>
</html>
