<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=0.85, maximum-scale=2.0">
<title>KY Secret · 建议 / Issue</title>
<style>
/* ===== KY Secret 全站视觉系统 V3 — 建议页 ===== */
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{background:#f7fafc;color:#0f2a40;padding:2rem 1rem;display:flex;justify-content:center;min-height:100vh}
.ky-container{max-width:780px;width:100%;margin:0 auto}
.nav-header{text-align:center;margin-bottom:2.5rem}
.logo{font-size:5rem;font-weight:900;color:#000;letter-spacing:-0.02em;margin-bottom:0.5rem;line-height:1}
.nav-buttons{display:flex;gap:0.75rem;justify-content:center;margin-bottom:1.2rem;flex-wrap:wrap}
.nav-btn{padding:0.5rem 1.4rem;border:1px solid #e2e8f0;border-radius:40px;background:#fff;color:#334155;text-decoration:none;font-size:0.9rem;font-weight:550;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.nav-btn:hover{background:#eef2f6;border-color:#cbd5e1}
.nav-btn.active{background:#0f172a;color:#fff;border-color:#0f172a}
.card{background:#fff;border-radius:28px;border:1px solid #ecf1f7;box-shadow:0 4px 14px rgba(0,20,40,.02);padding:2rem 2rem 2.2rem;margin-bottom:1.5rem}
.card-header{margin-bottom:.4rem;display:flex;align-items:center;gap:.6rem}
.card-header h1{font-size:1.65rem;font-weight:700;color:#0f2a40;letter-spacing:-.3px;display:flex;align-items:center;gap:.6rem}
.subtitle{font-size:.85rem;color:#7996ae;line-height:1.6;margin-bottom:1.6rem}
.form-item{margin-bottom:1.4rem}
.form-item label{display:block;font-size:.92rem;font-weight:600;color:#1e3f5c;margin-bottom:.55rem}
input,textarea{width:100%;padding:.9rem 1.2rem;border:1.5px solid #e2ecf5;border-radius:20px;font-size:.95rem;background:#fff;transition:.15s;color:#1f3a57;outline:0;font-family:inherit}
input:focus,textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.08)}
input::placeholder,textarea::placeholder{color:#9bb1c4}
textarea{min-height:160px;resize:vertical;line-height:1.6}
.btn-primary{width:100%;padding:1rem 1.5rem;background:#0f172a;color:#fff;border:1px solid #1e2a44;border-radius:40px;font-size:1.05rem;font-weight:650;letter-spacing:.3px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:.6rem;font-family:inherit}
.btn-primary:hover{background:#1e2f45;transform:scale(1.01);box-shadow:0 8px 18px rgba(15,35,60,.12)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{background:#eef2f6;color:#334155;border:1px solid #dbe2ec;width:auto;padding:.6rem 1.4rem;border-radius:40px;font-size:.88rem;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn-ghost:hover{background:#e2eaf1;border-color:#9fb8d0}
.back{font-size:.85rem;color:#334155;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem;margin-bottom:1rem;padding:.45rem 1.2rem;border:1px solid #e2e8f0;border-radius:40px;background:#fff;font-weight:550;transition:.15s}
.back:hover{background:#eef2f6}
.issue{background:#fafeff;border:1.5px solid #e2ecf5;border-radius:20px;padding:1.1rem 1.3rem;margin-bottom:.8rem;cursor:pointer;transition:.15s}
.issue:hover{background:#f2f9ff;border-color:#91b8d9;transform:translateY(-1px)}
.issue .t{font-size:1rem;font-weight:650;color:#0f2a40}
.issue .m{font-size:.74rem;color:#7996ae;margin-top:.4rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.st{display:inline-block;padding:2px 12px;border-radius:20px;font-size:.72rem;font-weight:700}
.st.open{background:#fef3c7;color:#92400e}.st.resolved{background:#dcfce7;color:#166534}.st.closed{background:#e2e8f0;color:#475569}
.reply{background:#fafeff;border:1px solid #e2ecf5;border-radius:16px;padding:.8rem 1rem;margin:.6rem 0;font-size:.9rem;white-space:pre-wrap;line-height:1.65;color:#1f3a57}
.reply .rm{font-size:.72rem;color:#94a3b8;margin-bottom:.35rem}
.res{display:none;margin-top:1.2rem;padding:1rem 1.2rem;border-radius:18px;font-size:.88rem;line-height:1.65}
.res.ok{display:block;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.res.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
.token{font-family:SFMono-Regular,Consolas,monospace;font-size:.76rem;word-break:break-all;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:.65rem .8rem;margin-top:.55rem;color:#0f2a40}
.detail-body{font-size:.95rem;line-height:1.75;white-space:pre-wrap;color:#1f3a57;margin-bottom:1.2rem}
.sep{border-top:1px solid #eef3fa;margin:1.4rem 0}
.muted{color:#7996ae;font-size:.75rem;text-align:center;margin-top:1.2rem}
.footer-note{text-align:center;margin-top:1.8rem;font-size:.75rem;color:#7996ae;border-top:1px solid #e2ecf5;padding-top:1.8rem}
.footer-note a{color:#2c5282;text-decoration:none;font-weight:500;margin:0 .4rem}
.footer-note a:hover{text-decoration:underline}
@media(max-width:550px){.logo{font-size:4rem}.card{padding:1.5rem}.card-header h1{font-size:1.35rem}}
</style>
</head>
<body>
<div class="ky-container">
  <div class="nav-header">
    <div class="logo">KYSECRET</div>
    <div class="nav-buttons">
      <a href="./status/index.html" class="nav-btn">📊 状态</a>
      <a href="./status/history.html" class="nav-btn">📋 历史</a>
      <a href="./index.html" class="nav-btn">✉️ 投稿</a>
      <a href="./result.html" class="nav-btn">🔍 查询</a>
      <a href="./complaints.html" class="nav-btn">📣 投诉</a>
      <a href="./issues.html" class="nav-btn active">💡 建议</a>
      <a href="./admin/index.html" class="nav-btn">⚙️ 管理</a>
    </div>
  </div>

  <div class="card" id="listCard">
    <div class="card-header"><h1>💡 建议 / Issue</h1></div>
    <div class="subtitle">对本网站或整体体系有问题、建议？在这里提出，管理员和同学都可以回复。</div>
    <div id="issueList"><div style="color:#94a3b8;font-size:.85rem">加载中...</div></div>
    <button class="btn-primary" style="margin-top:1rem" onclick="showCreate()"><span>✏️</span> 发布新建议</button>
    <div class="muted">图片功能预留，暂未开放。</div>
  </div>

  <div class="card" id="createCard" style="display:none">
    <a class="back" href="javascript:showList()">← 返回列表</a>
    <div class="card-header"><h1>✏️ 发布建议</h1></div>
    <div class="subtitle">标题 + 文字正文，暂不支持图片。</div>
    <div class="form-item">
      <label>标题</label>
      <input id="i_title" placeholder="一句话说明问题或建议" autocomplete="off">
    </div>
    <div class="form-item">
      <label>正文</label>
      <textarea id="i_body" placeholder="详细描述：发生了什么、你希望怎样改进"></textarea>
    </div>
    <button id="btnCreate" class="btn-primary" onclick="createIssue()"><span>🚀</span> 发布</button>
    <div class="res" id="resCreate"></div>
  </div>

  <div class="card" id="detailCard" style="display:none">
    <a class="back" href="javascript:showList()">← 返回列表</a>
    <div class="card-header"><h1 id="dTitle"></h1></div>
    <div class="subtitle" id="dMeta"></div>
    <div class="detail-body" id="dBody"></div>
    <div id="dReplies"></div>
    <div class="sep"></div>
    <div class="form-item">
      <label>回复</label>
      <textarea id="r_body" placeholder="输入回复内容" style="min-height:100px"></textarea>
    </div>
    <div class="form-item">
      <label>访问凭证</label>
      <input id="r_token" placeholder="发布时获得，仅本人可回复" autocomplete="off">
    </div>
    <button class="btn-primary" onclick="reply()"><span>💬</span> 提交回复</button>
    <div class="res" id="resReply"></div>
  </div>

  <div class="footer-note">
    <a href="./status/index.html">📊 实时状态</a> ·
    <a href="./status/history.html">📋 历史事件</a> ·
    <a href="./index.html">✉️ 匿名投稿</a>
    <br><span style="font-size:.7rem;color:#94a3b8">RV_1.21_Stable</span>
  </div>
</div>

<script>
var B='',ALL=[],CUR=null;
(function init(){
  var urls=['https://ky-secret-v3.pages.dev/config.json','https://raw.githubusercontent.com/QSNTH/KY-Secret-V3/refs/heads/main/config.json','/config.json'];
  function tryAt(i){if(i>=urls.length){toastList('配置加载失败');return;}
    var u=urls[i];u+=(u.indexOf('?')>=0?'&':'?')+'t='+Date.now();
    fetch(u).then(function(r){return r.json()}).then(function(c){B=(c.backend||'').trim();load();}).catch(function(){tryAt(i+1);});}
  tryAt(0);
  var m=location.search.match(/[?&]id=(\d+)/);
  if(m)setTimeout(function(){openIssue(parseInt(m[1],10));},300);
})();
function api(p){return B+'/api'+p;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function lm(s){return {open:'讨论中',resolved:'已解决',closed:'已关闭'}[s]||esc(s);}
function toastList(msg){document.getElementById('issueList').innerHTML='<div style="color:#e74c3c;font-size:.85rem">'+esc(msg)+'</div>';}
function showCreate(){document.getElementById('listCard').style.display='none';document.getElementById('detailCard').style.display='none';document.getElementById('createCard').style.display='block';}
function showList(){document.getElementById('createCard').style.display='none';document.getElementById('detailCard').style.display='none';document.getElementById('listCard').style.display='block';load();}
function load(){
  fetch(api('/issues')).then(function(r){return r.json();}).then(function(d){
    ALL=d||[];
    var el=document.getElementById('issueList');
    if(!ALL.length){el.innerHTML='<div style="color:#94a3b8;font-size:.85rem">还没有建议，来发第一条吧</div>';return;}
    el.innerHTML=ALL.map(function(it){
      return '<div class="issue" onclick="openIssue('+it.id+')"><div class="t">'+esc(it.title||'')+'</div>'
        +'<div class="m"><span class="st '+esc(it.status)+'">'+lm(it.status)+'</span><span>'+esc((it.created_at||'').substring(5,16))+'</span><span>#'+it.id+'</span></div></div>';
    }).join('');
  }).catch(function(e){toastList('加载失败: '+e.message);});
}
function createIssue(){
  var title=document.getElementById('i_title').value.trim();
  var body=document.getElementById('i_body').value.trim();
  if(!title||!body){setRes('resCreate','err','标题和正文不能为空');return;}
  if(!B){setRes('resCreate','err','配置加载中，请稍候再试');return;}
  var btn=document.getElementById('btnCreate');btn.disabled=true;
  fetch(api('/issues'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title,body:body})})
  .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||('错误 '+r.status));return d;});})
  .then(function(d){
    try{localStorage.setItem('ky_issue_token_'+d.id,d.token);}catch(e){}
    setRes('resCreate','ok','✅ 已发布（#'+d.id+'）。请保存访问凭证，用于日后回复：<div class="token">'+d.token+'</div>'
      +'<button class="btn-ghost" style="margin-top:.8rem" onclick="openIssue('+d.id+')">打开这条建议</button>');
  })
  .catch(function(e){setRes('resCreate','err','发布失败：'+e.message);})
  .finally(function(){btn.disabled=false;});
}
function openIssue(id){
  if(id){CUR=id;}
  document.getElementById('listCard').style.display='none';
  document.getElementById('createCard').style.display='none';
  document.getElementById('detailCard').style.display='block';
  var saved='';try{saved=localStorage.getItem('ky_issue_token_'+id)||'';}catch(e){}
  document.getElementById('r_token').value=saved;
  fetch(api('/issues/'+id)).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||('错误 '+r.status));return d;});})
  .then(function(it){
    document.getElementById('dTitle').textContent=it.title||'';
    document.getElementById('dMeta').innerHTML='<span class="st '+esc(it.status)+'">'+lm(it.status)+'</span> · #'+it.id+' · '+esc(it.created_at||'');
    document.getElementById('dBody').textContent=it.body||'';
    var rp=document.getElementById('dReplies');
    if(it.replies&&it.replies.length){
      rp.innerHTML='<div style="font-size:.82rem;color:#64748b;font-weight:600;margin-bottom:.3rem">回复 ('+it.replies.length+')</div>'+it.replies.map(function(r){
        return '<div class="reply"><div class="rm">'+esc((r.created_at||'').substring(5,16))+'</div>'+esc(r.body)+'</div>';
      }).join('');
    }else{rp.innerHTML='<div style="font-size:.82rem;color:#94a3b8">暂无回复</div>';}
  })
  .catch(function(e){document.getElementById('dBody').textContent='加载失败: '+e.message;});
}
function reply(){
  if(!CUR)return;
  var body=document.getElementById('r_body').value.trim();
  var token=document.getElementById('r_token').value.trim();
  if(!body||!token){setRes('resReply','err','回复内容和访问凭证不能为空');return;}
  if(!B){setRes('resReply','err','配置加载中，请稍候再试');return;}
  fetch(api('/issues/'+CUR+'/replies'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:body,token:token})})
  .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||('错误 '+r.status));return d;});})
  .then(function(){setRes('resReply','ok','已提交');document.getElementById('r_body').value='';try{localStorage.setItem('ky_issue_token_'+CUR,token);}catch(e){}openIssue(CUR);})
  .catch(function(e){setRes('resReply','err','失败：'+e.message);});
}
function setRes(id,cls,html){var e=document.getElementById(id);e.className='res '+cls;e.innerHTML=html;}
</script>
</body>
</html>
